apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dra-driver-ovsdpdk
  namespace: dra-driver-ovsdpdk
spec:
  selector:
    matchLabels:
      app: dra-driver-ovsdpdk
  template:
    metadata:
      labels:
        app: dra-driver-ovsdpdk
    spec:
      serviceAccountName: dra-driver-ovsdpdk
      hostPID: true
      initContainers:
        - name: init-users
          image: IMAGE
          command:
            - sh
            - -c
            - |
              nsenter --mount=/proc/1/ns/mnt -- getent passwd > /user-db/passwd
              nsenter --mount=/proc/1/ns/mnt -- getent group  > /user-db/group
              echo "Populated passwd and group from host NSS"
              cat /user-db/passwd | wc -l
              cat /user-db/group  | wc -l
          securityContext:
            privileged: true
          volumeMounts:
            - name: user-db
              mountPath: /user-db
      containers:
        - name: driver
          image: IMAGE
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/dra-driver-ovsdpdk
            - --node-name=$(NODE_NAME)
            - --namespace=$(NAMESPACE)
            - --enable-device-metadata
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            privileged: true
          volumeMounts:
            - name: user-db
              mountPath: /etc/passwd
              subPath: passwd
              readOnly: true
            - name: user-db
              mountPath: /etc/group
              subPath: group
              readOnly: true
            - name: kubelet-plugins
              mountPath: /var/lib/kubelet/plugins
            - name: kubelet-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: cdi-root
              mountPath: /var/run/cdi
            - name: socket-root
              mountPath: /var/run/ovsdpdk
            - name: ovs-run
              mountPath: /var/run/openvswitch
      volumes:
        - name: user-db
          emptyDir: {}
        - name: kubelet-plugins
          hostPath:
            path: /var/lib/kubelet/plugins
            type: DirectoryOrCreate
        - name: kubelet-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: DirectoryOrCreate
        - name: cdi-root
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: socket-root
          hostPath:
            path: /var/run/ovsdpdk
            type: DirectoryOrCreate
        - name: ovs-run
          hostPath:
            path: /var/run/openvswitch
            type: DirectoryOrCreate
